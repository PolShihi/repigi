{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Edit{% else %}Add{% endif %} employee{% endblock title %}
{% block content %}
<h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} employee</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <input type="submit" value="save">
</form>
{% endblock content %}
